name: iOS scenario checks

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test core and enforce coverage
        run: ./scripts/check-coverage.sh
      - name: Download model artifact
        run: ./scripts/download-model.sh
      - name: Build llama.cpp for iOS Simulator
        run: ./scripts/build-llama.sh
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project "AI Anti Fraud 3.0.xcodeproj" -scheme PwnedNext
          -sdk iphonesimulator -configuration Debug -derivedDataPath build
          -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)"
          ONLY_ACTIVE_ARCH=YES build