<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Anti Fraud 3.0 iOS data flow</title>
  <desc id="desc">Neutral data-flow diagram with a user, iOS app trust boundary, model, parser, SQLite database, decision engine, and result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#25445e"/></marker>
    <style>
      .label { font: 16px -apple-system, BlinkMacSystemFont, sans-serif; fill: #102a3d; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #4f6475; }
      .box { fill: #f7fbff; stroke: #0b5cad; stroke-width: 2; }
      .store { fill: #fff8ea; stroke: #b06b00; stroke-width: 2; }
      .boundary { fill: none; stroke: #657b8c; stroke-width: 2; stroke-dasharray: 9 7; }
      .flow { fill: none; stroke: #25445e; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="50" y="48" class="label" font-weight="700">AI Anti Fraud 3.0 · iOS data flow</text>
  <text x="50" y="73" class="small">Normal architecture view with trust boundaries and data stores</text>

  <rect x="190" y="105" width="820" height="445" rx="14" class="boundary"/>
  <text x="212" y="133" class="small">iOS application process</text>

  <rect x="45" y="270" width="110" height="70" rx="8" class="box"/>
  <text x="100" y="301" text-anchor="middle" class="label">Tester</text>
  <text x="100" y="324" text-anchor="middle" class="small">question</text>

  <rect x="235" y="175" width="165" height="80" rx="8" class="box"/>
  <text x="317" y="207" text-anchor="middle" class="label">SwiftUI UI</text>
  <text x="317" y="231" text-anchor="middle" class="small">input and result</text>

  <rect x="475" y="175" width="165" height="80" rx="8" class="box"/>
  <text x="557" y="207" text-anchor="middle" class="label">SQL model</text>
  <text x="557" y="231" text-anchor="middle" class="small">local artifact</text>

  <rect x="715" y="175" width="165" height="80" rx="8" class="box"/>
  <text x="797" y="207" text-anchor="middle" class="label">Tool parser</text>
  <text x="797" y="231" text-anchor="middle" class="small">SQL extraction</text>

  <path d="M155 305 H235" class="flow"/>
  <path d="M400 215 H475" class="flow"/>
  <path d="M640 215 H715" class="flow"/>

  <rect x="475" y="365" width="165" height="90" rx="8" class="store"/>
  <text x="557" y="401" text-anchor="middle" class="label">SQLite</text>
  <text x="557" y="425" text-anchor="middle" class="small">transactions</text>

  <rect x="715" y="365" width="165" height="90" rx="8" class="box"/>
  <text x="797" y="401" text-anchor="middle" class="label">Decision</text>
  <text x="797" y="425" text-anchor="middle" class="small">fraud verdict</text>

  <path d="M797 255 V365" class="flow"/>
  <path d="M715 410 H640 V255" class="flow"/>
  <path d="M880 410 H950 V215 H880" class="flow"/>
  <path d="M715 215 H650 V305 H400" class="flow"/>
  <path d="M235 305 H155" class="flow"/>
  <text x="475" y="520" class="small">Local data remains inside the app process</text>
</svg>