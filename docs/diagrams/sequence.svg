  <text class="st5" transform="translate(44 56)"><tspan x="0" y="0">The iOS app keeps the mobile investigation flow inside one process. The user question enters through the SwiftUI screen or the custom URL entry point. </tspan><tspan x="0" y="15.6">The bundled llama.cpp model returns a SQL tool call, the parser extracts the query, SQLite returns rows, and the same TinyLLama interprets those rows </tspan><tspan x="0" y="31.2">into the natural-language answer shown to the user.</tspan></text>
