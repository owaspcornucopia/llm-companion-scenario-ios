<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI Anti Fraud 3.0 iOS investigation sequence</title>
  <desc id="desc">Neutral sequence diagram showing the user question moving from SwiftUI through the model, parser, SQLite, decision engine, and back.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#25445e"/></marker>
    <style>
      .label { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #102a3d; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #4f6475; }
      .life { stroke: #93a6b4; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .flow { stroke: #25445e; stroke-width: 2; marker-end: url(#arrow); }
      .return { stroke: #5d7281; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="45" y="42" class="label" font-weight="700">AI Anti Fraud 3.0 · iOS investigation sequence</text>
  <text x="45" y="66" class="small">Question, local model, SQL, database rows, decision, and visible result</text>
  <g>
    <text x="120" y="112" text-anchor="middle" class="label">Tester</text>
    <text x="300" y="112" text-anchor="middle" class="label">SwiftUI</text>
    <text x="480" y="112" text-anchor="middle" class="label">SQL model</text>
    <text x="660" y="112" text-anchor="middle" class="label">Parser</text>
    <text x="840" y="112" text-anchor="middle" class="label">SQLite</text>
    <text x="1020" y="112" text-anchor="middle" class="label">Decision</text>
    <path d="M120 125 V620 M300 125 V620 M480 125 V620 M660 125 V620 M840 125 V620 M1020 125 V620" class="life"/>

    <path d="M120 170 H300" class="flow"/><text x="210" y="160" text-anchor="middle" class="small">fraud question</text>
    <path d="M300 235 H480" class="flow"/><text x="390" y="225" text-anchor="middle" class="small">prompt</text>
    <path d="M480 300 H660" class="flow"/><text x="570" y="290" text-anchor="middle" class="small">SQL tool call</text>
    <path d="M660 365 H840" class="flow"/><text x="750" y="355" text-anchor="middle" class="small">query</text>
    <path d="M840 430 H1020" class="flow"/><text x="930" y="420" text-anchor="middle" class="small">transaction rows</text>
    <path d="M1020 495 H300" class="return"/><text x="660" y="485" text-anchor="middle" class="small">verdict, SQL, and rows</text>
    <path d="M300 560 H120" class="return"/><text x="210" y="550" text-anchor="middle" class="small">visible result</text>
  </g>
</svg>